[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-tsshara-monitor"
version = "0.0.1"
description = "Monitoramento Serial dos Nobreaks UPS SYAL IN 4 a 12kVA TS Shara"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyserial",
    "paho-mqtt<2.0.0"
]

[project.scripts]
ups = "ups_tsshara_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]  # erros, imports, upgrades, bugbear, simplify

[tool.pytest.ini_options]
testpaths = ["tests"]
