services:
  # Instância Base do Monitor
  ups-monitor-nb-01:
    build: .
    container_name:  ups_monitor_nb_01
    devices:
      - /dev/TSSHARA0:/dev/ttyTSSHARA0
    env_file: "NB-01.env"
    # Mapeamento local do código fonte, só descomentar caso for necessário codar/debugar o código.
    volumes:
      - ./ups_tsshara_monitor:/app/ups_tsshara_monitor
    restart: unless-stopped

  # Instância para monitorar o nobreak dos serviores (NÃO COMMITAR)
  ups-monitor-nb-02:
    build: .
    container_name: ups_monitor_nb_02
    devices:
      - /dev/TSSHARA1:/dev/ttyTSSHARA0
    env_file: "NB-02.env"
    # Mapeamento local do código fonte, só descomentar caso for necessário codar/debugar o código.
    #volumes:
    #  - ./ups_tsshara_monitor:/app/ups_tsshara_monitor
    restart: unless-stopped
